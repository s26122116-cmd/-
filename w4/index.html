<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  <style>
    /* ==========================================================================
       【1. 全局與主題變數設定 (Theme Variables)】
       ========================================================================== */
    :root {
      /* 背景色調 */
      --bg-color: #0b0d12;          /* 主背景：極深藍黑 */
      --card-bg: #151821;           /* 卡片背景：深灰藍 */
      --card-border: #282c3a;       /* 卡片預設邊框顏色 */

      /* 文字顏色 */
      --text-main: #e2e8f0;         /* 主要文字：亮灰白 */
      --text-sub: #8a94a6;          /* 次要/名字文字：柔和灰 */
      --text-glow: #00f0ff;         /* 發光文字色 */

      /* 【焦點輪播 (Highlight) 顏色設定】 */
      --highlight-border: #00f0ff;  /* 輪播聚焦時的邊框顏色 ( Neon 青藍 ) */
      --highlight-glow: rgba(0, 240, 255, 0.4); /* 輪播聚焦時的外發光色彩 */
      --highlight-scale: 1.05;      /* 聚焦時卡片的放大倍數 */

      /* 轉場動畫時間 */
      --transition-speed: 0.5s;
    }

    /* 基礎重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* ==========================================================================
       【2. 載入中 (Loading) 動畫樣式】
       ========================================================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4rem;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--highlight-border);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px var(--highlight-glow);
    }

    .loading-text {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: var(--highlight-border);
      text-shadow: 0 0 8px var(--highlight-glow);
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* ==========================================================================
       【3. 瀑布流排版 (Masonry Layout)】
       ========================================================================== */
    .masonry-container {
      width: 100%;
      max-width: 1200px;
      column-count: 3;             /* 預設 3 欄 */
      column-gap: 1.5rem;          /* 欄位間距 */
      display: none;              /* 初始隱藏，資料載入後顯示 */
    }

    @media (max-width: 900px) {
      .masonry-container {
        column-count: 2;          /* 平板 2 欄 */
      }
    }

    @media (max-width: 600px) {
      .masonry-container {
        column-count: 1;          /* 手機 1 欄 */
      }
    }

    /* ==========================================================================
       【4. 留言卡片樣式與 Focus 特效】
       ========================================================================== */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      break-inside: avoid;
      page-break-inside: avoid;
      transition: all var(--transition-speed) cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      opacity: 0.7;
      filter: blur(0.5px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-author {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text-glow);
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .card-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* 輪播 Highlight 樣式 */
    .card.highlight {
      opacity: 1;
      filter: blur(0px);
      transform: scale(var(--highlight-scale));
      border-color: var(--highlight-border);
      box-shadow: 0 0 25px var(--highlight-glow), inset 0 0 10px var(--highlight-glow);
      z-index: 10;
    }

    .card.dimmed {
      opacity: 0.35;
      filter: blur(1.5px);
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>SECRET MESSAGES</h1>
    <p>朋友對我的悄悄話留言牆</p>
  </header>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <main id="wall" class="masonry-container"></main>

  <script>
    /* ==========================================================================
       【5. 邏輯與網址設定】
       ========================================================================== */
    const RAW_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRt9_o2CabeG0Gb-SfrCYqD6HKBqPTbTK3gqpNn2UttlfMlUuKAaMx3yYDJ_y-RiqJulVSBSIdi-YQ1/pub?output=csv';

    // 輪播間隔（毫秒）：3000ms = 3 秒
    const ROTATE_INTERVAL = 3000;

    let cardsData = [];
    let cardElements = [];
    let currentIndex = 0;
    let carouselTimer = null;

    /* ==========================================================================
       【6. 健壯的 CSV Fetcher (包含 CORS 降級處理與 Cache Busting)】
       ========================================================================== */
    async function fetchCSVText() {
      // 加上 timestamp 避免瀏覽器快取
      const cacheBustUrl = `${RAW_CSV_URL}&t=${Date.now()}`;

      try {
        // 第一嘗試：直接 fetch
        const res = await fetch(cacheBustUrl);
        if (res.ok) {
          const text = await res.text();
          // 驗證是否拿到有效的 CSV (而不是 HTML 登入/警告頁面)
          if (!text.trim().startsWith('<!DOCTYPE html')) {
            return text;
          }
        }
      } catch (err) {
        console.warn('直接讀取 CSV 失敗，切換至 CORS Proxy...', err);
      }

      // 第二嘗試：若直接讀取失敗，經由公開跨網域代理 (AllOrigins) 讀取
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(cacheBustUrl)}`;
      const proxyRes = await fetch(proxyUrl);
      if (!proxyRes.ok) throw new Error(`Proxy HTTP error! Status: ${proxyRes.status}`);
      return await proxyRes.text();
    }

    /* ==========================================================================
       【7. CSV 解析器】
       ========================================================================== */
    function parseCSV(text) {
      const lines = text.split(/\r\n|\n/);
      const result = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const row = [];
        let insideQuote = false;
        let entry = '';

        for (let j = 0; j < line.length; j++) {
          const char = line[j];

          if (char === '"') {
            if (insideQuote && line[j + 1] === '"') {
              entry += '"';
              j++;
            } else {
              insideQuote = !insideQuote;
            }
          } else if (char === ',' && !insideQuote) {
            row.push(entry.trim());
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim());
        result.push(row);
      }
      return result;
    }

    /* ==========================================================================
       【8. 主流程：取得資料並渲染】
       ========================================================================== */
    async function fetchMessages() {
      try {
        const csvText = await fetchCSVText();
        const rawData = parseCSV(csvText);

        // 排除標題列，映射欄位 (0:時間, 1:名字, 2:悄悄話)
        cardsData = rawData.slice(1).map(row => ({
          timestamp: row[0] || '',
          name: row[1] || '匿名朋友',
          message: row[2] || ''
        })).filter(item => item.name || item.message); // 過濾全空資料

        document.getElementById('loading').style.display = 'none';
        const wall = document.getElementById('wall');
        wall.style.display = 'block';

        if (cardsData.length === 0) {
          wall.innerHTML = '<p style="text-align:center; color: var(--text-sub);">目前試算表中還沒有任何留言喔！</p>';
          return;
        }

        renderCards(cardsData);
        startCarousel();

      } catch (error) {
        console.error('CSV 載入失敗詳細資訊:', error);
        document.getElementById('loading').innerHTML = `
          <div style="color: #ff4757; text-align: center; max-width: 400px;">
            <p style="font-weight: bold; font-size: 1.1rem; margin-bottom: 0.5rem;">無法載入 Google 試算表</p>
            <p style="font-size: 0.85rem; color: var(--text-sub); line-height: 1.5;">
              請確認該 Google 試算表已開啟「發佈到網路」權限（檔案 -> 分享 -> 發佈到網路 -> 選擇 CSV 格式）。
            </p>
          </div>
        `;
      }
    }

    function renderCards(data) {
      const wall = document.getElementById('wall');
      wall.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-index', index);

        const formattedTime = item.timestamp.split(' ')[0] || item.timestamp;

        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">@ ${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(formattedTime)}</span>
          </div>
          <div class="card-body">${escapeHTML(item.message)}</div>
        `;

        wall.appendChild(card);
      });

      cardElements = Array.from(document.querySelectorAll('.card'));
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    /* ==========================================================================
       【9. 輪播 Highlight 控制】
       ========================================================================== */
    function startCarousel() {
      if (cardElements.length === 0) return;

      highlightCard(currentIndex);

      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardElements.length;
        highlightCard(currentIndex);
      }, ROTATE_INTERVAL);
    }

    function highlightCard(targetIndex) {
      cardElements.forEach((card, index) => {
        if (index === targetIndex) {
          card.classList.add('highlight');
          card.classList.remove('dimmed');
        } else {
          card.classList.remove('highlight');
          card.classList.add('dimmed');
        }
      });
    }

    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
